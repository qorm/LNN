name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting (gofmt)
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt needed on:"; gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race detector
        run: go test ./... -count=1 -race

      - name: Run ltc-sequence example (integration smoke test)
        run: go run ./examples/ltc-sequence

      # Native fuzzing smoke: each FuzzXxx target fuzzed for a short window.
      # The seed corpus already ran under the plain test step above; this adds
      # guided mutation coverage over the untrusted-stream and constructor
      # surfaces. Any crash fails the build (and uploads the minimized input).
      - name: Fuzz smoke (30s per target)
        run: make fuzz-smoke SMOKETIME=30s
